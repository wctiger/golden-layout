name: CI

on:
  push:
    branches: [develop, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Use React ${{ matrix.react }}
        if: matrix.react != '19'
        run: >
          npm install --no-save
          react@${{ matrix.react }} react-dom@${{ matrix.react }}
          @types/react@${{ matrix.react }} @types/react-dom@${{ matrix.react }}
      - run: npx playwright install --with-deps chromium
      - name: Format, lint and typecheck
        run: npx vp check
      - name: Test
        run: npx vp test run
      - name: Build
        run: npx vp pack
